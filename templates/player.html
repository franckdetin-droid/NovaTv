<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY TV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
}

.player-box{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

video{
    width:100%;
    max-height:100vh;
}

</style>

</head>


<body>


<div class="player-box">

<video

id="video"

controls

autoplay

playsinline

muted>

</video>

</div>



<script>


// Récupère le lien dans l'URL
// Exemple : player.html?url=https://site.com/chaine.m3u8


const params = new URLSearchParams(
window.location.search
);


const streamUrl = params.get("url");



const video =
document.getElementById("video");



if(streamUrl){


if(Hls.isSupported()){


const hls = new Hls({

enableWorker:true,

lowLatencyMode:true

});


hls.loadSource(streamUrl);


hls.attachMedia(video);



hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

video.play()
.catch(()=>{});

}

);



hls.on(
Hls.Events.ERROR,
(event,data)=>{

console.log(
"Erreur HLS",
data
);

}

);



}

else if(
video.canPlayType(
"application/vnd.apple.mpegurl"
)

){

video.src=streamUrl;

}


}


</script>


</body>

  </html>
