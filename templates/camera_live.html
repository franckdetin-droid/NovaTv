{% extends "base.html" %}

{% block title %}
🎥 Caméra Live - MY TV APP
{% endblock %}


{% block content %}


<section class="live-page">


<div class="live-topbar">


<div class="live-title">

<h1>
🎥 MY TV LIVE
</h1>

<p>
Diffusez votre contenu en direct.
</p>

</div>



<div class="live-info">


<span id="liveStatus">
⏹ Hors ligne
</span>


<span id="serverStatus">
🟡 Connexion...
</span>



<span class="viewer-counter">

👀

<span id="viewerCount">
0
</span>

Spectateurs

</span>


</div>


</div>





<div class="live-container">


<div class="main-live">


<div class="video-wrapper">


<!-- CAMERA DU CREATEUR -->

<video
id="camera"
autoplay
playsinline
muted>
</video>



<!-- APERÇU INVITES -->

<div id="remoteVideos">

</div>



<div class="live-overlay">


<div class="creator-name">

🔴 EN DIRECT

</div>



<div id="quality">

HD

</div>



</div>


</div>






<div class="live-controls">



<button
id="startBtn"
class="live-btn start">

🔴 Démarrer

</button>



<button
id="stopBtn"
class="live-btn stop">

⛔ Arrêter

</button>



<button
id="muteBtn"
class="live-btn">

🎤 Micro

</button>



<button
id="cameraBtn"
class="live-btn">

📷 Caméra

</button>



<button
id="switchBtn"
class="live-btn">

🔄 Changer

</button>



<button
id="screenBtn"
class="live-btn">

🖥 Écran

</button>



<button
id="fullscreenBtn"
class="live-btn">

⛶ Plein écran

</button>



</div>



<p id="message">

Prêt à diffuser.

</p>



</div>



</div>



</section>





<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<script>


const socket = io({

reconnection:true,

reconnectionAttempts:20

});



let stream = null;

let room = null;

let peerConnections = {};

let pendingIce = {};

let currentCamera = "user";

let isCreator = false;





const video =
document.getElementById(
"camera"
);



const message =
document.getElementById(
"message"
);



const liveStatus =
document.getElementById(
"liveStatus"
);



const serverStatus =
document.getElementById(
"serverStatus"
);



const viewerCount =
document.getElementById(
"viewerCount"
);





// ================================
// SOCKET
// ================================


socket.on(
"connect",
()=>{


serverStatus.innerHTML =
"🟢 Serveur connecté";



console.log(
"Socket:",
socket.id
);



if(room && isCreator){


socket.emit(
"join_camera",
{

room:room,

creator:true

}

);


}



});





socket.on(
"disconnect",
()=>{


serverStatus.innerHTML =
"🔴 Serveur déconnecté";


});





// ================================
// CREATION PEER POUR UN SPECTATEUR
// ================================


function createPeerConnection(id){



const peer =
new RTCPeerConnection({

iceServers:[

{

urls:[

"stun:stun.l.google.com:19302",

"stun:stun1.l.google.com:19302"

]

}

]

});





// Ajouter caméra + micro


if(stream){


stream.getTracks()
.forEach(track=>{


peer.addTrack(
track,
stream
);


});


}




peer.onicecandidate =
(event)=>{


if(event.candidate){


socket.emit(
"camera_ice",
{

target:id,

candidate:event.candidate

}

);


}


};




peerConnections[id]=peer;


return peer;


}





// ================================
// CREER OFFER POUR VIEWER
// ================================


async function createOffer(viewerId){


const peer =
createPeerConnection(
viewerId
);



const offer =
await peer.createOffer();



await peer.setLocalDescription(
offer
);



socket.emit(
"camera_offer",
{

target:viewerId,

offer:offer

}

);



console.log(
"📡 Offre envoyée :",
viewerId
);


}
    // =====================================
// NOUVEAU SPECTATEUR
// =====================================


socket.on(
"viewer_joined",
async(data)=>{


console.log(
"👀 Spectateur connecté :",
data.viewer_id
);



viewerCount.innerHTML =
data.count;



await createOffer(
data.viewer_id
);



});





// =====================================
// MISE A JOUR COMPTEUR
// =====================================


socket.on(
"viewer_count",
(data)=>{


viewerCount.innerHTML =
data.count;



console.log(
"Spectateurs :",
data.count
);


});





// =====================================
// RECEVOIR OFFER
// =====================================


socket.on(
"camera_offer",
async(data)=>{


console.log(
"📩 Offre reçue",
data.sender
);



const peer =
createPeerConnection(
data.sender
);



await peer.setRemoteDescription(

new RTCSessionDescription(
data.offer
)

);




const answer =
await peer.createAnswer();



await peer.setLocalDescription(
answer
);



socket.emit(
"camera_answer",
{

target:data.sender,

answer:answer

}

);



});





// =====================================
// RECEVOIR ANSWER
// =====================================


socket.on(
"camera_answer",
async(data)=>{


const peer =
peerConnections[data.sender];



if(!peer){

return;

}



await peer.setRemoteDescription(

new RTCSessionDescription(
data.answer
)

);



console.log(
"✅ Connexion WebRTC OK"
);



});





// =====================================
// RECEVOIR ICE
// =====================================


socket.on(
"camera_ice",
async(data)=>{


const peer =
peerConnections[data.sender];



const candidate =
new RTCIceCandidate(
data.candidate
);



if(peer && peer.remoteDescription){


try{


await peer.addIceCandidate(
candidate
);



}catch(e){


console.log(
"ICE erreur",
e
);


}



}else{


if(!pendingIce[data.sender]){

pendingIce[data.sender]=[];

}



pendingIce[data.sender].push(
candidate
);



}



});







// =====================================
// DEMARRER LE LIVE
// =====================================


document.getElementById(
"startBtn"
)
.onclick =
async()=>{


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{

width:1280,

height:720,

facingMode:currentCamera

},

audio:true

});



video.srcObject =
stream;



await video.play();




const response =
await fetch(
"/start-camera-live",
{

method:"POST"

}

);



const data =
await response.json();




if(data.success){



room =
"camera_live_"+data.live_id;



isCreator = true;



socket.emit(
"join_camera",
{

room:room,

creator:true

}

);



liveStatus.innerHTML =
"🔴 EN DIRECT";



message.innerHTML =
"✅ Diffusion active";



}else{


message.innerHTML =
"❌ Impossible de démarrer";

}


}catch(error){



console.log(error);



message.innerHTML =
"❌ "+error.message;


}



};







// =====================================
// ARRETER LE LIVE
// =====================================


document.getElementById(
"stopBtn"
)
.onclick =
()=>{


if(stream){


stream.getTracks()
.forEach(track=>{


track.stop();


});


stream=null;


}



Object.values(
peerConnections
)
.forEach(peer=>{


peer.close();


});



peerConnections={};



if(room){


socket.emit(
"stop_camera",
{

room:room

}

);


}



video.srcObject=null;



viewerCount.innerHTML="0";



liveStatus.innerHTML =
"⏹ Hors ligne";



message.innerHTML =
"Live arrêté";



};








// =====================================
// MICRO
// =====================================


document.getElementById(
"muteBtn"
)
.onclick =
()=>{


if(!stream)
return;



const audio =
stream.getAudioTracks()[0];



if(audio){


audio.enabled =
!audio.enabled;



document.getElementById(
"muteBtn"
).innerHTML =

audio.enabled
?
"🎤 Micro"
:
"🔇 Muet";


}



};








// =====================================
// CAMERA ON/OFF
// =====================================


document.getElementById(
"cameraBtn"
)
.onclick =
()=>{


if(!stream)
return;



const track =
stream.getVideoTracks()[0];



if(track){


track.enabled =
!track.enabled;


}



};








// =====================================
// CHANGER CAMERA
// =====================================


document.getElementById(
"switchBtn"
)
.onclick =
async()=>{


currentCamera =
currentCamera==="user"
?
"environment"
:
"user";



const newStream =
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:currentCamera

},

audio:true

});



const newVideo =
newStream.getVideoTracks()[0];



const newAudio =
newStream.getAudioTracks()[0];



video.srcObject =
newStream;



stream =
newStream;




Object.values(
peerConnections
)
.forEach(peer=>{


peer.getSenders()
.forEach(sender=>{


if(sender.track?.kind==="video"){


sender.replaceTrack(
newVideo
);


}



if(sender.track?.kind==="audio"){


sender.replaceTrack(
newAudio
);


}



});


});



};
    // =====================================
// PARTAGE ECRAN
// =====================================

document.getElementById(
"screenBtn"
)
.onclick =
async()=>{


try{


const screen =
await navigator.mediaDevices.getDisplayMedia({

video:true,

audio:true

});



const screenTrack =
screen.getVideoTracks()[0];



video.srcObject =
screen;



Object.values(
peerConnections
)
.forEach(peer=>{


const sender =
peer.getSenders()
.find(
s=>s.track &&
s.track.kind==="video"
);



if(sender){

sender.replaceTrack(
screenTrack
);

}


});



screenTrack.onended =
()=>{


video.srcObject =
stream;



Object.values(
peerConnections
)
.forEach(peer=>{


const sender =
peer.getSenders()
.find(
s=>s.track &&
s.track.kind==="video"
);



const cameraTrack =
stream.getVideoTracks()[0];



if(sender && cameraTrack){


sender.replaceTrack(
cameraTrack
);


}



});


};



}catch(error){


console.log(
"Partage écran annulé",
error
);


}


};








// =====================================
// CHAT LIVE
// =====================================


const chatMessages =
document.getElementById(
"chatMessages"
);



const chatButton =
document.getElementById(
"sendChat"
);



if(chatButton){


chatButton.onclick =
()=>{


const input =
document.getElementById(
"chatText"
);



if(!input.value.trim()){

return;

}



socket.emit(
"live_message",
{

room:room,

message:
input.value

}

);



input.value="";



};


}



socket.on(
"live_message",
(data)=>{


if(!chatMessages)
return;



const div =
document.createElement(
"div"
);



div.className =
"chat-item";



div.innerHTML =
`
<b>${data.user}</b>
:
${data.message}
`;



chatMessages.appendChild(
div
);



chatMessages.scrollTop =
chatMessages.scrollHeight;



});









// =====================================
// REACTIONS LIVE
// =====================================


document.querySelectorAll(
".reaction-btn"
)
.forEach(button=>{


button.onclick =
()=>{


socket.emit(
"live_reaction",
{

room:room,

emoji:
button.dataset.emoji

}

);


};



});





socket.on(
"live_reaction",
(data)=>{


const box =
document.getElementById(
"floatingReactions"
);



if(!box)
return;



const emoji =
document.createElement(
"div"
);



emoji.className =
"floating-emoji";



emoji.innerHTML =
data.emoji;



box.appendChild(
emoji
);



setTimeout(
()=>{


emoji.remove();


},
3000
);



});









// =====================================
// QUALITE RESEAU
// =====================================


setInterval(
()=>{


Object.values(
peerConnections
)
.forEach(peer=>{


if(peer.connectionState==="connected"){


document.querySelector(
".quality"
).innerHTML =
"🟢 HD";


}


if(peer.connectionState==="connecting"){


document.querySelector(
".quality"
).innerHTML =
"🟡 Connexion";


}


if(peer.connectionState==="failed"){


document.querySelector(
".quality"
).innerHTML =
"🔴 Faible";


}



});


},
3000
);









// =====================================
// PLEIN ECRAN
// =====================================


document.getElementById(
"fullscreenBtn"
)
.onclick =
()=>{


let target =
video;



if(target.requestFullscreen){


target.requestFullscreen();


}else if(
target.webkitRequestFullscreen
){


target.webkitRequestFullscreen();


}


};









// =====================================
// RECONNEXION SOCKET
// =====================================


socket.on(
"connect",
()=>{


serverStatus.innerHTML =
"🟢 Serveur connecté";



if(room){


socket.emit(
"join_camera",
{

room:room,

creator:true

}

);


}



});









// =====================================
// FERMETURE PAGE
// =====================================


window.addEventListener(
"beforeunload",
()=>{


if(stream){


stream.getTracks()
.forEach(
track=>
track.stop()
);


}



Object.values(
peerConnections
)
.forEach(
peer=>
peer.close()
);



if(room){


socket.emit(
"cleanup_live",
{

room:room

}

);


}



socket.disconnect();



});









// =====================================
// DEMARRAGE
// =====================================


console.log(
"🎥 MY TV LIVE WebRTC chargé avec compteur spectateurs."
);
    {% endblock %}
